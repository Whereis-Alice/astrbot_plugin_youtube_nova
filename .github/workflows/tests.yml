name: Plugin tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install plugin and SDK dependencies
        run: python -m pip install -r requirements.txt "astrbot>=4.25,<5" "pytest>=8,<10"
      - name: Run regression tests
        run: python -m pytest -q
